# Autonomous agent loop: an agent picks one eligible open issue with business
# judgment, a second agent plans the implementation, a Cursor CLI worker
# implements the plan, verifies the full CI surface locally, opens a PR and
# arms auto-merge. Fully unattended; Orca (local) supervises.
#
# Design notes (see .github/agent/README.md for the runbook):
#   - Everything that writes to GitHub uses AGENT_GH_PAT (fine-grained PAT,
#     contents+PRs+issues write, NO workflow scope). The default GITHUB_TOKEN
#     would not trigger `pull_request` checks on the PRs we open, so the
#     required contexts would never run and auto-merge would never fire.
#   - The PAT is scoped to the steps that need it and the checkout uses
#     persist-credentials:false — the worker (and any code it writes) must
#     never be able to read a credential.
#   - Exactly ONE agent PR in flight at a time: branch protection runs with
#     strict:false, so two green agent PRs could land without revalidating
#     against each other.
#   - Auto-merge is the LAST git-affecting step; every agent PR carries
#     `do-not-rebase` so auto-update-prs.yml never pushes to it after arming
#     (lesson 2026-06-13: auto-merge fires on the first green commit).
name: agent-loop

on:
  schedule:
    - cron: "0 6,13,20 * * *" # 3 runs/day — pacing for the Cursor budget (official slots; ALWAYS run in full)
    - cron: "15,45 * * * *"   # poll tick, every 30min at :15/:45 (never :00 — disjoint from the official slots). Near-zero-cost no-op unless the last substantive run failed and the backoff window elapsed — see "Circuit breaker & retry gate" in .github/agent/README.md
  workflow_dispatch:
    inputs:
      issue:
        description: "Force a specific issue # (still passes the safety filters)"
        required: false

concurrency:
  group: agent-loop
  cancel-in-progress: false

permissions:
  actions: write # `gh run list` (read) for the circuit breaker AND retry gate, plus
  # `gh run cancel` (write) so a no-op poll tick self-cancels instead of
  # completing as a plain "success" — that distinction is what lets both
  # this token's own run-history queries skip past no-op ticks. Every
  # content/PR/issue write still goes through AGENT_GH_PAT, unaffected.

jobs:
  run-one-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # hard cap so a stuck issue can't burn the Cursor budget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Guard — secrets configured, one agent PR in flight
        id: guard
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
          CURSOR_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$CURSOR_KEY" ]; then
            echo "AGENT_GH_PAT / CURSOR_API_KEY not configured; loop disarmed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --state open --label agent-pr --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An agent PR is already open; skipping this run."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry gate — sondeo solo tras fallo real + backoff
        id: retry_gate
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # gh run list (read) + gh run cancel (write) on the no-op path — never a content-write credential
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          POLL_CRON: "15,45 * * * *" # must match the second on.schedule entry above verbatim
          BACKOFF_SECONDS: "3600" # 1h backoff — see .github/agent/README.md "Circuit breaker & retry gate"
        run: |
          # Fail OPEN toward the official cadence: only throttle when the
          # schedule string matches the poll cron EXACTLY. Anything else —
          # official cron, workflow_dispatch (EVENT_SCHEDULE is empty there),
          # or a cron string that drifted out of sync with `on.schedule` —
          # proceeds unthrottled. This direction fails safe if the constant
          # ever drifts from the real cron line.
          if [ "$EVENT_SCHEDULE" != "$POLL_CRON" ]; then
            echo "Official/manual trigger (schedule='$EVENT_SCHEDULE') — proceeding as always."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Poll tick. Look at the most recent SUBSTANTIVE run (success or
          # failure), excluding the current run AND prior no-op poll ticks
          # (which self-cancel below, conclusion=cancelled). --limit 50: up
          # to ~46 poll ticks can sit between two official slots.
          proceed=false
          last=$(gh run list --workflow agent-loop.yml --json databaseId,conclusion,updatedAt --limit 50 \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})
                        | select(.conclusion == "success" or .conclusion == "failure")][0]')
          conclusion=$(echo "$last" | jq -r '.conclusion // empty')
          if [ "$conclusion" = "failure" ]; then
            finished_at=$(echo "$last" | jq -r '.updatedAt')
            elapsed=$(( $(date -u +%s) - $(date -u -d "$finished_at" +%s) ))
            if [ "$elapsed" -ge "$BACKOFF_SECONDS" ]; then
              echo "Last substantive run failed ${elapsed}s ago (>= ${BACKOFF_SECONDS}s) — retrying now."
              proceed=true
            else
              echo "Last substantive run failed only ${elapsed}s ago — waiting for a later poll tick."
            fi
          else
            echo "Last substantive run did not fail (conclusion=${conclusion:-none}) — nothing to retry."
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

          if [ "$proceed" != "true" ]; then
            echo "No-op poll tick — self-cancelling (conclusion=cancelled) so run-history queries skip it."
            gh run cancel ${{ github.run_id }} || true
            sleep 60
          fi

      # Installed early, before Pick issue: the picker (inside pick-issue.sh)
      # and the Plan implementation step both invoke cursor-agent themselves,
      # ahead of the heavier setup (submodule/uv/node) further down that only
      # Implement actually needs.
      - name: Install Cursor CLI
        if: steps.guard.outputs.proceed == 'true' && steps.retry_gate.outputs.proceed == 'true'
        run: |
          curl -fsS https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Circuit breaker — fallos seguidos
        id: breaker
        if: steps.guard.outputs.proceed == 'true' && steps.retry_gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }} # only calls gh run list (read) here; never a content-write credential
        run: |
          # Proxy signal, not ground truth: gh run list exposes conclusion
          # but not infra-vs-attempt failure, so "last 3 runs all failed" is
          # the best available approximation of "Cursor's budget/quota may be
          # exhausted." A run that the Guard step itself skips concludes
          # success, which correctly resets the streak — a paused loop isn't
          # evidence of exhaustion. Explicitly exclude the CURRENT run: gh run
          # list can already list it (conclusion=null, in progress), which
          # would otherwise always keep the breaker closed.
          #
          # With a single engine there is nowhere left to escalate to — this
          # just skips the run rather than burning a 4th attempt against a
          # possibly-exhausted Cursor quota. The skipped run itself concludes
          # success/skip, which resets the streak next cycle.
          #
          # Since the poll cron was added, no-op poll ticks self-cancel
          # (conclusion=cancelled) instead of completing as a plain success —
          # they are filtered out here for the same reason a Guard-disarmed
          # run's success was already excluded: neither is a real attempt.
          # --limit 50 (not 5): up to ~46 poll ticks can sit between two real
          # attempts. Known residual gap: a genuinely job-timed-out real
          # attempt, or a human-cancelled run, also reads as cancelled and is
          # equally invisible here — acceptable, no fix needed for now.
          last3=$(gh run list --workflow agent-loop.yml --json databaseId,conclusion --limit 50 \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }})
                       | select(.conclusion == "success" or .conclusion == "failure")
                       | .conclusion] | .[0:3]')
          all_failed=$(echo "$last3" | jq -r 'length == 3 and all(. == "failure")')
          if [ "$all_failed" = "true" ]; then
            echo "Last 3 runs all failed — skipping this run rather than burning a 4th attempt against a possibly-exhausted Cursor quota."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick issue
        id: pick
        if: steps.guard.outputs.proceed == 'true' && steps.retry_gate.outputs.proceed == 'true' && steps.breaker.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FORCED_ISSUE: ${{ inputs.issue }}
        run: bash .github/agent/pick-issue.sh

      - name: Claim issue
        if: steps.guard.outputs.proceed == 'true' && steps.pick.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
        run: gh issue edit "${{ steps.pick.outputs.number }}" --add-label "agent:wip"

      # ---- Full environment BEFORE the worker runs: it must be able to run
      # ---- the complete verification suite itself.
      - name: Resolve legalize-es gitlink SHA
        id: legalize-sha
        if: steps.pick.outputs.empty == 'false'
        run: echo "sha=$(git ls-tree HEAD data/legalize-es | awk '{print $3}')" >> $GITHUB_OUTPUT

      - name: Cache legalize-es submodule checkout
        id: legalize-cache
        if: steps.pick.outputs.empty == 'false'
        uses: actions/cache@v6
        with:
          path: data/legalize-es
          key: legalize-es-${{ runner.os }}-${{ steps.legalize-sha.outputs.sha }}

      - name: Shallow + partial clone of legalize-es (cache miss only)
        if: steps.pick.outputs.empty == 'false' && steps.legalize-cache.outputs.cache-hit != 'true'
        run: |
          git -c submodule.recurse=false \
              -c protocol.version=2 \
              submodule update --init --depth 1 --filter=blob:none data/legalize-es

      - name: Install uv
        if: steps.pick.outputs.empty == 'false'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - uses: actions/setup-node@v6
        if: steps.pick.outputs.empty == 'false'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies (mirror of ci.yml)
        if: steps.pick.outputs.empty == 'false'
        run: uv sync --extra chat --extra dashboards --extra dev --frozen

      - name: Install frontend dependencies
        if: steps.pick.outputs.empty == 'false'
        working-directory: frontend
        run: npm ci

      - name: Git identity + work branch
        if: steps.pick.outputs.empty == 'false'
        env:
          # Issue titles are third-party text; they reach the shell only
          # through env vars, never through ${{ }} inline interpolation.
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
          MODEL: ${{ steps.pick.outputs.model }}
        run: |
          git config user.name "lexflow-agent"
          git config user.email "agent-loop@users.noreply.github.com"
          slug=$(printf '%s' "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//' | cut -c1-40)
          git checkout -b "${{ steps.pick.outputs.branch_prefix }}/agent-issue-${{ steps.pick.outputs.number }}-$slug"

          # Attribute every commit made from here on (Implement + the Review
          # fix-round) to the model that actually produced it. A hook, not a
          # worker-prompt instruction: don't rely on the LLM to format a
          # trailer correctly — this fires on every `git commit`.
          model_slug=$(printf '%s' "$MODEL" | tr '[:upper:]/.' '[:lower:]--')
          trailer="Co-authored-by: Cursor (${MODEL}) <${model_slug}@users.noreply.github.com>"
          mkdir -p .git/hooks
          cat > .git/hooks/prepare-commit-msg <<HOOK
          #!/usr/bin/env bash
          # Installed by agent-loop.yml — appends engine attribution to every
          # commit made during this run. Skip merge/squash commits.
          case "\$2" in
            merge|squash) exit 0 ;;
          esac
          if ! grep -qF "${trailer}" "\$1"; then
            git interpret-trailers --if-exists doNothing --trailer "${trailer}" --in-place "\$1"
          fi
          HOOK
          chmod +x .git/hooks/prepare-commit-msg

      # ---- Plan implementation: a strong, read-only pass over the issue and
      # ---- the real repo before any code gets written. Lets Implement below
      # ---- use a cheaper model to EXECUTE the plan instead of reasoning the
      # ---- approach from scratch. Single call, no cascade (see model table
      # ---- in README.md); a failed or empty plan is a soft failure — worth
      # ---- logging, never worth blocking the run over, since Implement can
      # ---- still proceed by reasoning from the issue directly.
      - name: Plan implementation
        id: plan
        if: steps.pick.outputs.empty == 'false'
        env:
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Read-only reasoning over one issue + the repo, no tool-heavy
          # exploration loop — shorter ceiling than Implement. IDLE just
          # below CEILING, same reason as every other cursor-agent call
          # (see run-engine.sh header: no streaming, so idle can't trail
          # ceiling without killing real work).
          ENGINE_IDLE_TIMEOUT_SECONDS: "570"
          ENGINE_HARD_CEILING_SECONDS: "600"
        run: |
          {
            cat .github/agent/planner-prompt.md
            echo
            echo "<issue number=\"${{ steps.pick.outputs.number }}\">"
            printf 'TITLE: %s\n' "$ISSUE_TITLE"
            echo
            echo "BODY:"
            cat "$RUNNER_TEMP/issue-body.md"
            echo "</issue>"
          } > "$RUNNER_TEMP/plan-prompt.txt"
          set +e
          ENGINE_MODE=ask bash .github/agent/run-engine.sh "cursor" "gpt-5.3-codex" "$RUNNER_TEMP/plan-prompt.txt" \
            > "$RUNNER_TEMP/plan.md"
          rc=$?
          set -e
          if [ "$rc" != "0" ] || [ ! -s "$RUNNER_TEMP/plan.md" ]; then
            echo "Planner produced no usable plan (exit $rc) — Implement will proceed without one."
            rm -f "$RUNNER_TEMP/plan.md"
          fi

      # ---- Implement. No GitHub-write credentials in this step's env: the
      # ---- issue body is third-party data and the worker executes arbitrary
      # ---- code.
      - name: Implement (Cursor worker)
        id: implement
        if: steps.pick.outputs.empty == 'false'
        env:
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
          # GitHub-write creds stay excluded from this step; only the model
          # credential is present.
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Wide-scope issues genuinely need exploration room (2026-08-25,
          # issue #52: killed mid-exploration by a flat 15min cap) — give
          # Implement a generous idle window and hard ceiling.
          #
          # IDLE is set just below CEILING (not a real "no new output for
          # 360s" window): verified 2026-08-28 that cursor-agent's default
          # text output prints NOTHING until the whole response is ready —
          # a real Implement call took 666s of total silence before its
          # first byte. A short idle window kills real work before it can
          # finish; see run-engine.sh's header for the full explanation and
          # the streaming-based real fix this is standing in for.
          ENGINE_IDLE_TIMEOUT_SECONDS: "2340"
          ENGINE_HARD_CEILING_SECONDS: "2400"
        run: |
          {
            cat .github/agent/worker-prompt.md
            if [ -s "$RUNNER_TEMP/plan.md" ]; then
              echo
              echo "## Plan de implementación a seguir"
              echo
              cat "$RUNNER_TEMP/plan.md"
            fi
            echo
            echo "<issue number=\"${{ steps.pick.outputs.number }}\">"
            printf 'TITLE: %s\n' "$ISSUE_TITLE"
            echo
            echo "BODY:"
            cat "$RUNNER_TEMP/issue-body.md"
            echo "</issue>"
          } > "$RUNNER_TEMP/prompt.txt"
          set +e
          bash .github/agent/run-engine.sh "${{ steps.pick.outputs.engine }}" "${{ steps.pick.outputs.model }}" "$RUNNER_TEMP/prompt.txt" \
            | tee "$RUNNER_TEMP/worker-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          # Explicit alternation, not a greedy [A-Z_]* class: a model that
          # runs prose directly after the marker with no whitespace (e.g.
          # "AGENT_RESULT: DONESprint 4 ...") would otherwise glob capitals
          # from the next word into the token and match no case branch.
          result=$(grep -oE 'AGENT_RESULT: (ALREADY_DONE|DONE|BLOCKED)' "$RUNNER_TEMP/worker-output.txt" | tail -1 | cut -d' ' -f2 || true)
          commits=$(git rev-list --count origin/main..HEAD)
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          # `result` is written ONLY once we know its final, true value — it
          # used to be written before the DONE-but-empty-diff guard below
          # could still invalidate it, so Cleanup's infra-vs-attempt split
          # (which keys off `result != DONE`) misclassified that guard
          # failure as a real attempt instead of the infra failure it is.
          if [ "$rc" != "0" ]; then
            # Best-effort text match on the worker's own output: a model
            # could print these words in unrelated prose, so this is a
            # heuristic, not proof — but it's a faster, more specific signal
            # than waiting for 3 generic infra fails to escalate to a human.
            if grep -qiE '429|rate.?limit|quota|insufficient.?(credit|balance)' "$RUNNER_TEMP/worker-output.txt"; then
              reason="implement-quota-exhausted"
            else
              case "$rc" in
                124) reason="implement-hard-ceiling" ;;
                125) reason="implement-idle-timeout" ;;
                *) reason="implement-infra-other" ;;
              esac
            fi
            echo "result=NONE" >> "$GITHUB_OUTPUT"
            echo "$reason" > "$RUNNER_TEMP/failure-reason.txt"
            echo "::error::cursor-agent exited $rc (infra failure — not an attempt)"
            exit 1
          fi
          case "$result" in
            DONE)
              # Empty-diff guard: a headless CLI worker can exit "successfully"
              # with no real work done — this is an infra-class failure, so it
              # must never count as one of the 2 real attempts before
              # agent:blocked.
              if [ "$commits" = "0" ] || [ -n "$(git status --porcelain)" ]; then
                echo "result=EMPTY_DIFF" >> "$GITHUB_OUTPUT"
                echo "implement-infra-empty-diff" > "$RUNNER_TEMP/failure-reason.txt"
                echo "::error::Worker said DONE but the tree is not a clean set of new commits — infra failure."
                exit 1
              fi
              echo "result=DONE" >> "$GITHUB_OUTPUT" ;;
            ALREADY_DONE)
              echo "result=ALREADY_DONE" >> "$GITHUB_OUTPUT"
              echo "Issue already implemented on main; will close it." ;;
            BLOCKED)
              echo "result=BLOCKED" >> "$GITHUB_OUTPUT"
              echo "implement-blocked" > "$RUNNER_TEMP/failure-reason.txt"
              echo "::error::Worker reported BLOCKED."
              exit 1 ;;
            *)
              echo "result=NONE" >> "$GITHUB_OUTPUT"
              echo "implement-infra-no-marker" > "$RUNNER_TEMP/failure-reason.txt"
              echo "::error::No AGENT_RESULT marker in worker output (infra failure — not an attempt)."
              exit 1 ;;
          esac

      - name: Close already-done issue
        if: steps.implement.outputs.result == 'ALREADY_DONE'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
        run: |
          tail -c 2000 "$RUNNER_TEMP/worker-output.txt" > "$RUNNER_TEMP/evidence.txt"
          {
            echo "Closed by the agent loop: verification found every checklist item already implemented on \`main\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/evidence.txt"
            echo '```'
          } > "$RUNNER_TEMP/close-comment.md"
          gh issue close "${{ steps.pick.outputs.number }}" --comment "$(cat "$RUNNER_TEMP/close-comment.md")"

      # ---- Review: a second agent reviews the diff BEFORE the PR exists.
      # ---- Post-PR inline review threads would deadlock the merge
      # ---- (required_conversation_resolution), so all review happens here.
      # ---- One fix round allowed; a second FIX verdict fails the run.
      - name: Review (Cursor frontier cascade)
        if: steps.implement.outputs.result == 'DONE'
        env:
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Tighter than Implement's: this is where the real 84min hang
          # happened (run 32749623046, issue #85) — a review call reads a
          # diff and judges it, it doesn't need Implement's exploration room.
          # IDLE set just below CEILING — see run-engine.sh header: cursor-agent
          # doesn't stream, so a short idle window kills real (if slow) work.
          ENGINE_IDLE_TIMEOUT_SECONDS: "840"
          ENGINE_HARD_CEILING_SECONDS: "900"
        run: |
          compose_review_prompt() {
            {
              cat .github/agent/reviewer-prompt.md
              echo
              echo "<issue number=\"${{ steps.pick.outputs.number }}\">"
              printf 'TITLE: %s\n\n' "$ISSUE_TITLE"
              cat "$RUNNER_TEMP/issue-body.md"
              echo "</issue>"
              echo
              echo "<diff>"
              git diff origin/main..HEAD | head -c 200000
              echo "</diff>"
            } > "$RUNNER_TEMP/review-prompt.txt"
          }
          # Reviewer model cascade — judgment on security/correctness gets the
          # strongest reasoning we can afford, cheapest-first fallback only
          # when a step gives no parseable verdict. All three now live on
          # Cursor, on purpose diversified across upstream vendors so one
          # provider's outage doesn't take out the whole cascade:
          #   1) gpt-5.3-codex   OpenAI   — frontier, coding-specialised
          #   2) gpt-5.6-sol     OpenAI   — frontier alt, same vendor
          #   3) kimi-k3-max     Moonshot — different vendor, guaranteed final attempt
          # tee to stderr: each attempt's stdout must carry ONLY the verdict
          # (it is captured with $(...)), while the log still shows the review.
          run_review_attempt() {
            local engine="$1" model="$2"
            compose_review_prompt
            set +e
            bash .github/agent/run-engine.sh "$engine" "$model" "$RUNNER_TEMP/review-prompt.txt" \
              | tee "$RUNNER_TEMP/review-output.txt" >&2
            set -e
            grep -oE 'VERDICT: (APPROVE|FIX)' "$RUNNER_TEMP/review-output.txt" | tail -1 | cut -d' ' -f2
          }
          run_review() {
            local verdict=""
            verdict=$(run_review_attempt cursor gpt-5.3-codex)
            if [ -z "$verdict" ]; then
              echo "Reviewer: gpt-5.3-codex gave no verdict, trying gpt-5.6-sol." >&2
              verdict=$(run_review_attempt cursor gpt-5.6-sol)
            fi
            if [ -z "$verdict" ]; then
              echo "Reviewer: gpt-5.6-sol gave no verdict, trying kimi-k3-max." >&2
              verdict=$(run_review_attempt cursor kimi-k3-max)
            fi
            echo "$verdict"
          }
          verdict=$(run_review)
          if [ "$verdict" = "APPROVE" ]; then exit 0; fi
          if [ "$verdict" != "FIX" ]; then
            echo "review-no-verdict" > "$RUNNER_TEMP/failure-reason.txt"
            echo "::error::Reviewer emitted no parseable verdict from any model in the cascade (infra)."
            exit 1
          fi
          echo "Reviewer requested fixes; running one fix round."
          {
            cat .github/agent/worker-prompt.md
            echo
            echo "A reviewer examined your diff for issue #${{ steps.pick.outputs.number }} and requires fixes."
            echo "Address ONLY the numbered problems below, then commit. Same finish protocol."
            echo
            sed -n '/VERDICT: FIX/,$p' "$RUNNER_TEMP/review-output.txt"
          } > "$RUNNER_TEMP/fix-prompt.txt"
          # Real code work scoped to a numbered fix list, not open
          # exploration — a bit more room than a plain review verdict, but
          # not Implement's full 40min budget. Inline override: this call
          # sits inside a step whose `env:` otherwise sets the tighter
          # review-cascade values above. IDLE set just below CEILING — see
          # run-engine.sh header (no streaming, so idle can't trail ceiling).
          ENGINE_IDLE_TIMEOUT_SECONDS=1140 ENGINE_HARD_CEILING_SECONDS=1200 \
            bash .github/agent/run-engine.sh "${{ steps.pick.outputs.engine }}" "${{ steps.pick.outputs.model }}" "$RUNNER_TEMP/fix-prompt.txt"
          verdict=$(run_review)
          if [ "$verdict" != "APPROVE" ]; then
            echo "review-fix-exhausted" > "$RUNNER_TEMP/failure-reason.txt"
            echo "::error::Reviewer still not satisfied after one fix round."
            exit 1
          fi

      # ---- Verify: literal mirror of the required checks.
      - name: Verify — backend
        if: steps.implement.outputs.result == 'DONE'
        run: |
          trap 'echo verify-backend > "$RUNNER_TEMP/failure-reason.txt"' ERR
          uv run pytest -q -n auto --dist=loadfile
          uvx ruff check .
          uvx ruff format --check .
          uv run mypy src/lexflow/

      # pip-audit isn't a required branch-protection context, but the loop
      # itself arms auto-merge — without this, an agent PR that introduces
      # a CVE-flagged dependency could sail through Verify and land on main
      # unblocked. Always-on like ci.yml's own pip-audit job (a docs-only
      # PR must still catch a fresh upstream advisory).
      - name: Verify — pip-audit (CVE gate)
        if: steps.implement.outputs.result == 'DONE'
        run: |
          trap 'echo verify-pip-audit > "$RUNNER_TEMP/failure-reason.txt"' ERR
          uv run --with pip-audit pip-audit --skip-editable

      - name: Verify — frontend (only if touched)
        if: steps.implement.outputs.result == 'DONE'
        run: |
          trap 'echo verify-frontend > "$RUNNER_TEMP/failure-reason.txt"' ERR
          if git diff --name-only origin/main..HEAD | grep -q '^frontend/'; then
            cd frontend && npm run lint && npm run test && npm run build
          else
            echo "Diff does not touch frontend/; skipping."
          fi

      - name: Verify — landing (only if touched)
        if: steps.implement.outputs.result == 'DONE'
        run: |
          trap 'echo verify-landing > "$RUNNER_TEMP/failure-reason.txt"' ERR
          if git diff --name-only origin/main..HEAD | grep -q '^landing/'; then
            cd landing && npm install --no-audit --no-fund
            npx playwright install --with-deps chromium
            npm run typecheck && npm run build
          else
            echo "Diff does not touch landing/; skipping."
          fi

      # ---- Publish. Auto-merge is the LAST git-affecting step; nothing may
      # ---- push to this branch afterwards (lesson 2026-06-13).
      - name: Push, open PR, arm auto-merge
        if: steps.implement.outputs.result == 'DONE'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
          ISSUE_TITLE: ${{ steps.pick.outputs.title }}
        run: |
          trap 'echo push-pr > "$RUNNER_TEMP/failure-reason.txt"' ERR
          branch=$(git branch --show-current)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
          {
            echo "## Descripción"
            echo "Implementación autónoma del issue #${{ steps.pick.outputs.number }} por el agent loop (modelo \`${{ steps.pick.outputs.model }}\`)."
            echo
            echo "## Issue relacionado"
            echo "closes #${{ steps.pick.outputs.number }}"
            echo
            echo "## Checklist"
            echo "- [x] \`uv run pytest\` verde en el runner del loop"
            echo "- [x] \`uvx ruff check .\` y \`uvx ruff format --check .\` repo-wide"
            echo "- [x] \`uv run mypy src/lexflow/\`"
            echo "- [x] \`pip-audit\` (CVE gate)"
            echo "- [x] Frontend lint+test+build si el diff toca \`frontend/\`"
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > "$RUNNER_TEMP/pr-body.md"
          # --head explicit: the push above went to an inline-credential URL
          # rather than a named remote, so git never recorded a tracking
          # branch — gh pr create's autodetection fails without --head
          # ("you must first push the current branch to a remote").
          gh pr create \
            --title "${{ steps.pick.outputs.branch_prefix }}: resolve #${{ steps.pick.outputs.number }} — $ISSUE_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --head "$branch" \
            --label agent-pr --label do-not-rebase
          gh pr merge --auto --merge

      # ---- Cleanup runs on EVERY outcome (always(), not failure(): a
      # ---- timeout CANCELS later steps, and cancelled steps skip
      # ---- if:failure()). Distinguishes success / attempt-failure / infra.
      - name: Cleanup and attempt accounting
        if: always() && steps.pick.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GH_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n="${{ steps.pick.outputs.number }}"
          gh issue edit "$n" --remove-label "agent:wip" || true

          result="${{ steps.implement.outputs.result }}"
          implement_outcome="${{ steps.implement.outcome }}"

          reason_file="$RUNNER_TEMP/failure-reason.txt"
          if [ -f "$reason_file" ]; then
            reason=$(cat "$reason_file")
          elif [ "${{ job.status }}" = "cancelled" ]; then
            # timeout-minutes cancels the job before a later step can write
            # the file — Cleanup itself still runs (if: always()).
            reason="job-timeout"
          else
            reason="unknown"
          fi

          # Success paths: PR armed, or issue closed as already done.
          if [ "$result" = "ALREADY_DONE" ]; then exit 0; fi
          if [ "$result" = "DONE" ] && [ "${{ job.status }}" = "success" ]; then exit 0; fi

          # Infra failures don't count as real attempts: cursor-agent crashed,
          # no marker, quota/gateway errors, DONE-but-empty-diff. They DO get
          # their own counter, though — an issue that reliably infra-fails
          # (e.g. genuinely too large for a single call) would otherwise
          # retry forever, 3x/day, with no escalation path (found
          # 2026-08-25 investigating issue #52's timeout).
          if [ "$implement_outcome" = "failure" ] && [ "$result" != "BLOCKED" ] && [ "$result" != "DONE" ]; then
            infra_attempts=$(gh issue view "$n" --json comments \
              --jq '[.comments[].body | select(contains("<!-- agent-infra -->"))] | length')
            infra_attempts=$((infra_attempts + 1))
            gh issue comment "$n" --body "<!-- agent-infra --> Agent loop infra failure $infra_attempts ($reason, engine=${{ steps.pick.outputs.engine }}, model=${{ steps.pick.outputs.model }}, not a real attempt): $RUN_URL"
            if [ "$infra_attempts" -ge 3 ]; then
              gh issue edit "$n" --add-label "agent:infra-stuck" || true
            fi
            exit 0
          fi

          # Attempt failure: BLOCKED, verify red, publish red, or review
          # cascade exhausted.
          attempts=$(gh issue view "$n" --json comments \
            --jq '[.comments[].body | select(contains("<!-- agent-attempt -->"))] | length')
          attempts=$((attempts + 1))
          gh issue comment "$n" --body "<!-- agent-attempt --> Agent loop attempt $attempts failed ($reason): $RUN_URL"
          if [ "$attempts" -ge 2 ]; then
            gh issue edit "$n" --add-label "agent:blocked" --remove-label "agent:failed" || true
          else
            gh issue edit "$n" --add-label "agent:failed" || true
          fi

          # Close any half-open PR and delete the orphan branch.
          branch=$(git branch --show-current)
          if [ "$branch" != "main" ] && [ -n "$branch" ]; then
            pr=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty' || true)
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch || true
            else
              # The implement step can push before PR creation fails (e.g.
              # gh pr create autodetection issues) — remove the orphan
              # remote branch directly when there is no PR to close it via.
              git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ":refs/heads/$branch" 2>/dev/null || true
            fi
          fi
